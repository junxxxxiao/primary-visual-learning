<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TS-04C 混合 DSL 候选评审</title>
<style>
  :root { --ink:#17212b; --paper:#fffdf7; --panel:#fff; --line:#c9d0d6; --accent:#ff786a; }
  * { box-sizing:border-box; }
  body { margin:0; background:#edf1f4; color:var(--ink); font:16px/1.45 system-ui,-apple-system,"PingFang SC",sans-serif; }
  main { min-height:100vh; display:grid; grid-template-columns:minmax(320px,1fr) 330px; gap:16px; padding:18px; }
  section,aside { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  header { padding:14px 16px; border-bottom:1px solid var(--line); }
  h1 { margin:0 0 10px; font-size:20px; }
  select,button { font:inherit; border:1px solid var(--line); border-radius:7px; background:#fff; padding:8px 11px; }
  select { width:100%; }
  canvas { width:100%; height:auto; aspect-ratio:49/34; display:block; background:var(--paper); }
  .controls { display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:14px 16px; border-top:1px solid var(--line); }
  button { background:var(--ink); color:#fff; transition:background-color 160ms cubic-bezier(0.23,1,0.32,1),transform 160ms cubic-bezier(0.23,1,0.32,1); }
  button:active { transform:scale(.97); }
  input { width:100%; accent-color:var(--ink); }
  aside { padding:18px; display:grid; align-content:start; gap:16px; }
  .caption { font-size:21px; font-weight:750; }
  .note { border-left:4px solid var(--accent); padding-left:12px; color:#47515b; }
  .meta { color:#6f7b86; font-size:14px; }
  @media (max-width:820px) { main { grid-template-columns:1fr; padding:10px; } .controls { grid-template-columns:auto 1fr; } .time { grid-column:1/-1; } }
</style>
<main>
  <section aria-label="候选动画评审">
    <header><h1 id="title">加载中</h1><select id="scene"></select></header>
    <canvas id="canvas" width="980" height="680"></canvas>
    <div class="controls"><button id="play">播放</button><input id="progress" type="range" min="0" max="1" step="0.001" value="0" aria-label="讲解进度"><span id="time" class="time">0.0s</span></div>
  </section>
  <aside>
    <div class="meta">校准预览</div>
    <div id="caption" class="caption"></div>
    <div id="status" class="meta"></div>
  </aside>
</main>
<script type="module" src="./src/hybrid-candidate-review.js"></script>
</html>
